[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultwise-ml"
version = "0.1.0"
description = "Reproducible C-MAPSS RUL baseline for FaultWise AI"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
faultwise-train = "faultwise_ml.training:main"

[tool.setuptools.packages.find]
where = ["src"]
